name: Build
on:
  workflow_dispatch:
    inputs:
      container_refresh:
        description: 'Only rebuild and push the container of a release tag on a fresh base image (no new release)'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to refresh. Leave empty to use the newest release tag'
        required: false
        default: ''
  push:
    paths-ignore:
      - '.github/**'
      - 'doc/**'
    tags-ignore:
      - 'v*'
env:
  NODE_VERSION: '24'
jobs:

  lint:
    if: ${{ false }}  # disable for now
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Make npm binaries accessible
        run: echo "${PWD}/node_modules/.bin" >> $GITHUB_PATH
      - name: Lint code
        run: npm run lint

  build:
    runs-on: ubuntu-latest
#    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Build CometVisu
        uses: ./.github/actions/build-cv
        with:
          target: build

  unit-test:
    name: "UNIT-TEST"
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        target: ['stable', 'beta', 'canary']
        browser: ['Chrome_ci']
    env:
      CV_VERSION: ${{ matrix.target }}
      CV_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
      - name: Build CometVisu
        uses: ./.github/actions/build-cv
        with:
          target: source
      - name: Install browser
        run: ./utils/ci/browser-setup.sh
        shell: bash
      - name: Install grunt
        run: npm install -g grunt-cli
      - id: dotenv
        uses: falti/dotenv-action@v1.2.0
        with:
          path: .browser-env
      - name: Run tests
        run: grunt karma:ci --browser=$CV_BROWSER
        env:
          CHROME_BIN: ${{ steps.dotenv.outputs.BROWSER_PATH }}
      - name: Run coveralls
        if: env.CV_VERSION == 'stable' && env.CV_BROWSER == 'Chrome_ci'
        uses: coverallsapp/github-action@v2.3.7
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

  deploy-docker:
    name: "[DEPLOY] - Deploy Docker container and Sentry release"
    if: |
      github.repository == 'CometVisu/CometVisu' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.container_refresh)
    runs-on: ubuntu-latest
    needs: [ 'unit-test' ]
    steps:
      # The workflow itself always runs from the branch it was started on, but a
      # container refresh has to build the sources of the release tag instead.
      - name: Resolve release to build
        id: release
        env:
          CONTAINER_REFRESH: ${{ inputs.container_refresh }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CURRENT_REF: ${{ github.ref }}
        run: |
          ref="$CURRENT_REF"
          if [[ "$CONTAINER_REFRESH" == "true" ]]; then
            tag="$RELEASE_TAG"
            if [[ -z "$tag" ]]; then
              tag=$(git ls-remote --tags --refs "$REPOSITORY_URL" 'v*' |
                awk -F/ '{print $NF}' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V | tail -1)
            fi
            if [[ -z "$tag" ]]; then
              echo "No release tag found to refresh" >&2
              exit 1
            fi
            echo "Refreshing container of release $tag"
            ref="refs/tags/$tag"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ steps.release.outputs.ref }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
      - run: npm install -g grunt-cli
      - run: npm install
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.0
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install python dependencies
        run: |
          python -m pip install -r utils/requirements.txt
      - name: Update DocumentationMapping
        run: ./cv doc --doc-type manual -f -l de
      - name: Create CometVisu release for docker
        run: CV_TAG_RUNTIME=docker grunt release-cv
      - name: Move to release folder
        run: mv release build
      - name: Install Sentry CLI
        run: curl -sL https://sentry.io/get-cli/ | bash
      # Injected even on a container refresh to keep the container content identical
      # to the release it is based on, the debug IDs are derived from the file content.
      - name: Inject Sentry debug IDs
        run: sentry-cli sourcemaps inject --ignore node_modules/ --ignore test/ ./build
      - name: Create Sentry release
        if: ${{ !inputs.container_refresh }}
        run: |
          export SENTRY_RELEASE=$(sentry-cli releases propose-version)
          sentry-cli releases new -p $SENTRY_PROJECT $SENTRY_RELEASE
          sentry-cli releases set-commits --auto $SENTRY_RELEASE
          sentry-cli sourcemaps upload -r $SENTRY_RELEASE --no-rewrite --ignore node_modules/ --ignore test/ ./build
          sentry-cli releases finalize $SENTRY_RELEASE
        env:
          SENTRY_ORG: cometvisu
          SENTRY_PROJECT: cometvisu
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Push to Docker Hub
        run: ./utils/ci/docker_push.sh
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
